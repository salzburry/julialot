# ============================================================================
# Sample Oncology — Generic LOT Configuration Template
# ============================================================================
# This is an ILLUSTRATIVE config showing how to adapt the generic LOT
# framework for a different cancer type. Replace placeholder values
# with actual drug codes and clinical rules for your indication.
#
# This example loosely models a non-small cell lung cancer (NSCLC) scenario
# to demonstrate how the same framework handles different:
#   - Drug classes and codes
#   - Induction windows
#   - Line-ending procedures (surgery instead of SCT)
#   - Excluded classes
# ============================================================================

disease:
  name: "Non-Small Cell Lung Cancer"
  abbreviation: "NSCLC"
  icd10_codes: ["C34.1", "C34.2", "C34.3", "C34.8", "C34.9"]
  description: "Illustrative LOT config for NSCLC (not validated for production)"

# ============================================================================
# ALGORITHM PARAMETERS
# ============================================================================
parameters:
  # NSCLC typically uses a 28-day induction window (one cycle)
  induction_window_days: 28

  # Standard 90-day MAP gap
  map_gap_days: 90

  # Medical claims default day supply
  medical_day_supply: 28

  # Discontinuation gap
  lot_discon_gap_days: 90

  # Maximum lines
  max_lot_lines: 5

  # No excluded classes in this example (no steroid-like class)
  excluded_classes_from_lot_start: []

# ============================================================================
# CLAIMS DATA MAPPING
# ============================================================================
claims_mapping:
  patient_id_field: "PATID"

  # Adjust these to your data source
  medical_table: "your_catalog.your_schema.medical"
  medical_date_field: "FST_DT"
  medical_code_fields:
    - "PROC_CD"

  rx_table: "your_catalog.your_schema.rx"
  rx_date_field: "FILL_DT"
  rx_code_field: "NDC"
  rx_days_supply_field: "DAYS_SUP"

# ============================================================================
# MEDICATIONS
# ============================================================================
medications:
  rollup:
    # -- Platinum-based chemotherapy --
    - medication: "carboplatin"
      class: "PLATINUM"
      abbreviation: "CARB"
      monomaintenance: false

    - medication: "cisplatin"
      class: "PLATINUM"
      abbreviation: "CISP"
      monomaintenance: false

    # -- Taxanes --
    - medication: "paclitaxel"
      class: "TAXANE"
      abbreviation: "PACL"
      monomaintenance: false

    - medication: "docetaxel"
      class: "TAXANE"
      abbreviation: "DOCE"
      monomaintenance: false

    # -- Checkpoint inhibitors (immunotherapy) --
    - medication: "pembrolizumab"
      class: "CPI"
      abbreviation: "PEMBRO"
      monomaintenance: true

    - medication: "nivolumab"
      class: "CPI"
      abbreviation: "NIVO"
      monomaintenance: true

    - medication: "atezolizumab"
      class: "CPI"
      abbreviation: "ATEZO"
      monomaintenance: true

    # -- Targeted therapy (EGFR) --
    - medication: "osimertinib"
      class: "EGFR_TKI"
      abbreviation: "OSIM"
      monomaintenance: true

    - medication: "erlotinib"
      class: "EGFR_TKI"
      abbreviation: "ERLO"
      monomaintenance: true

    # -- Targeted therapy (ALK) --
    - medication: "alectinib"
      class: "ALK_TKI"
      abbreviation: "ALEC"
      monomaintenance: true

    - medication: "crizotinib"
      class: "ALK_TKI"
      abbreviation: "CRIZ"
      monomaintenance: true

  # PLACEHOLDER codes — replace with actual NDC/HCPCS codes
  codelist:
    - code_type: "HCPCS"
      code: "J9045"
      medication: "carboplatin"
      class: "PLATINUM"
      abbreviation: "CARB"

    - code_type: "HCPCS"
      code: "J9060"
      medication: "cisplatin"
      class: "PLATINUM"
      abbreviation: "CISP"

    - code_type: "HCPCS"
      code: "J9267"
      medication: "paclitaxel"
      class: "TAXANE"
      abbreviation: "PACL"

    - code_type: "HCPCS"
      code: "J9271"
      medication: "pembrolizumab"
      class: "CPI"
      abbreviation: "PEMBRO"

    - code_type: "HCPCS"
      code: "J9299"
      medication: "nivolumab"
      class: "CPI"
      abbreviation: "NIVO"

  # Permissible substitutions within same class
  permissible_substitutions:
    - original: "CARB"
      substitute: "CISP"
    - original: "CISP"
      substitute: "CARB"
    - original: "PACL"
      substitute: "DOCE"
    - original: "DOCE"
      substitute: "PACL"

# ============================================================================
# LINE-ENDING PROCEDURES
# ============================================================================
# In NSCLC, surgery (lobectomy/pneumonectomy) could end a line.
# These are illustrative CPT codes.
procedures:
  codelist:
    - code_type: "HCPCS"
      code: "32480"
      procedure_type: "LOBECTOMY"

    - code_type: "HCPCS"
      code: "32440"
      procedure_type: "PNEUMONECTOMY"

    - code_type: "HCPCS"
      code: "32663"
      procedure_type: "VATS_LOBECTOMY"
