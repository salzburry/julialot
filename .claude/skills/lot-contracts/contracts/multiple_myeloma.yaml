# Multiple myeloma — the baseline contract.
# Extracted from Jul 28/lot/engine as shipped; the validator pins every value here to
# the engine's defaults, so this file and the code cannot drift apart silently.
# Change the engine, and this file (and the pin table) change in the same commit.
#
# The pin follows the CURRENT delivery, and only that one. Pointed at an older
# fork the validator reports axes that fork's engine does not ship - which is
# the pin working, not a fault in it. Do not widen a binding to make an older
# fork pass: the pin would then prove nothing for either. Give that fork its
# own contract file if it needs one.

tumor: multiple_myeloma
contract_version: 6
status: baseline_extracted

provenance:
  source: extracted from Jul 28/lot/engine (config_lot.R defaults and step files)
  reviewed_by: []
  notes: "v1 at the materialization pass, the NDMM study run. v2 records three axes the engine gained on 2026-08-13 and this file had not - lines.discon_confirm_days, lines.discon_confirmed_by_return, event_streams.CART.induction_absorbed - and the pin now reads build_lot.R's CONTRACT instead of copying it, which is why they were invisible until v2. v3 records advancement.prior_line_agent_return, the axis behind the study team's August fold-in request - the engine gained a gated APPLY_MAP_FOLDIN mode, pinned off, and new_line stays the study's algorithm until the team decides on the evaluation cells. v4 records the short-course axis: on 2026-08-30 the study team adopted the melphalan rule, so advancement.short_course_rule moves from none to applied and this tumor's algorithm now includes it. The five-branch modes the team asked for first were measured and not adopted; they are comparison cells and no contract build carries one. v5 adopts the MAP fold-in with the study team's count: advancement.prior_line_agent_return moves from new_line to one_advance_joins. v6 makes the engine match advancement.same_regimen_gap_days, which has read none since v1: a re-challenge of the line's own regimen no longer advances the line, and the line runs over the break instead"

observation:
  censor_at_disenrollment: false

episodes:
  medical_day_supply: 28
  pharmacy_missing_day_supply: 28
  map_discon_gap_days: 90

drug_roles:
  default_role: line_defining
  supportive_classes:
    - STEROID
  backbone_classes: []
  maintenance_classes: []

equivalence:
  source: permissible_subs.csv
  pairs: []

lines:
  max_lot: 5
  line1_start_events:
    - MED
  regimen_window_days_line1: 60
  regimen_window_days_later: 30
  discon_confirm_days: 90
  discon_confirmed_by_return: true
  same_day_tie:
    - SCT_ALLO
    - SCT_CART
    - SCT_AUTO
    - MED
  end_priority:
    - SCT_ALLO
    - SCT_CART
    - SCT_AUTO
    - CART_INIT
    - MED_ADD
    - DEATH
    - DISCONTINUATION
    - STUDY_END

advancement:
  new_agent: true
  # A re-challenge of the line's OWN regimen never advances the line: a drug
  # the patient has had before is not a new agent, whatever the gap, and the
  # line runs over the break rather than a second line opening on the return.
  # Adopted 2026-08-30. Before that the engine released the drug after
  # lines.discon_gap_days and this axis and the engine disagreed.
  same_regimen_gap_days: none
  # A prior line's agent returning after the current line's regimen window:
  # new_line = it ends the line and starts the next (the study's algorithm);
  # joins_line = it folds into the line it returns in (the fold-in mode).
  # one_advance_joins = the return joins the line it returns in when exactly
  # one agent advanced the line between that drug's two doses; two or more and
  # it starts a line, as new_line always does.
  prior_line_agent_return: one_advance_joins
  # A brief course of one named agent, outside the line's regimen window, does
  # not advance the line on its own - the line is carried to the end of that
  # course's cover instead. Another line-defining agent starting while the
  # course still covers does advance the line, and it advances on the brief
  # course's own first day rather than the later agent's.
  #
  # applied = the rule is part of this tumor's algorithm; none = it is not.
  # In myeloma the agent is melphalan, whose brief courses are usually
  # transplant conditioning rather than a line of treatment.
  short_course_rule: applied
  short_course_agent: MELP
  short_course_max_days: 28
  short_course_chain_gap_days: 30
  drop_based: false

event_streams:
  AUTO:
    claim_window_days: 13
    merge_gap_days: 60
    tandem_max_gap_days: 180
    line_span: regimen
    may_start_line1: false
    may_start_later_lines: true
  ALLO:
    line_span: single_day
    may_start_line1: false
    may_start_later_lines: true
  CART:
    consolidation_days: 45
    bridging_med_add_days: 45
    induction_absorbed: true
    line_span: regimen
    may_start_line1: false
    may_start_later_lines: true

boundary_labels: {}

criteria:
  no_belantamab:
    enabled: true

expectations:
  note: face-validity bands live in build_lot.R (LOT_FACE_VALIDITY); move here in phase 2
