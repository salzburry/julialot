name: mdv_sep29 tests

# The MDV port's six suites, through the folder's own runner
# (mdv_sep29/tests/run_all.R). The folder is a delivery of its own, outside the
# gate the Sep 16 workflow runs, so without this job nothing checks it on a
# push. It reads nothing outside the folder, so only a change to the folder or
# to this file can move the result.
on:
  push:
    paths: &paths
      - 'mdv_sep29/**'
      - '.github/workflows/mdv_sep29-tests.yml'
  pull_request:
    paths: *paths

# Read-only: the job checks out the repository and runs tests.
permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # glue writes the SQL every suite inspects; the suites require it.
      - name: Install R dependencies
        run: Rscript -e 'install.packages("glue")'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Pinned. sqlglot translates the Spark SQL the builds emit and duckdb
      # executes it, so a new version of either can change what the suites
      # assert without a line of the folder changing. These are the versions
      # the suites were verified against; move them deliberately.
      - name: Install Python dependencies
        run: pip install 'duckdb==1.5.6' 'sqlglot==30.20.0'
      # One entry point, one exit status. A skipped suite fails it too.
      - name: All six suites (exits non-zero if any is not as expected)
        run: Rscript mdv_sep29/tests/run_all.R
