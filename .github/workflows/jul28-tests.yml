name: Jul 28 tests

# The merge gate for the study folder. Two jobs: the R suites, and the
# planted-patient harnesses that run the engine's emitted SQL in duckdb. Both
# work off the repository's own files - no warehouse, no credentials, no
# connection - so the claim "all suites pass" stops being something an author
# reports and becomes something a machine records against a commit.
#
# It runs. Between 13 and 30 August every run ended in seconds with no runner
# assigned and no logs, here and in cohort_explorer-tests.yml - an account-level
# Actions problem rather than a failing suite, and this comment used to say so.
# Runners came back on 30 August and the gate has recorded real results since.
#
# The reading advice still holds for any FUTURE outage, because the symptom is
# distinctive: a run with no logs that lasted seconds never started, whatever
# its colour. Open the run before reading a red check as a failing suite, and
# fall back to Rscript validation/run_gate.R locally.
#
# Scoped to changes that can affect it: the study folder, the checks that hold
# it to its claims, and this file.
#
# apr_30_2026/** is in the list because the port suites compare the study
# folder against it. A change there changes what they are comparing to, so
# leaving it out meant an edit to the baseline could move the comparison
# without the gate that watches the comparison ever running.
on:
  push:
    paths: &paths
      - 'Jul 28/**'
      # The delivery the LOT engine actually lives in now. Left out, a change
      # to the engine running on production triggered no gate at all - and the
      # harness job below, which is the only thing that runs its SQL, never saw
      # it.
      - 'Sep 10/**'
      - 'validation/**'
      - 'apr_30_2026/**'
      # The tumour contracts, because one of the suites holds the engine to
      # them. Left out, a contract-only change skipped the very gate that
      # checks the contract still binds.
      - '.claude/skills/lot-contracts/**'
      - '.github/workflows/jul28-tests.yml'
  pull_request:
    paths: *paths

# Read-only. Nothing here comments, pushes, or publishes - both jobs check out
# the repository and run tests - so the token these jobs get should not be able
# to do any of it. The default is broader than that.
permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # glue writes the SQL every suite inspects. The suites carry a stand-in
      # and degrade to it, but a run that silently took the stand-in is checking
      # slightly different text from the one production loads, so install it and
      # have the real thing.
      - name: Install R dependencies
        run: Rscript -e 'install.packages("glue")'
      # One entry point, one exit status. It pins the port suite's known
      # failures BY IDENTITY and fails if the set moves in either direction -
      # one fixed and one introduced leaves the count unchanged, which is why the
      # count is not what is pinned. A skipped suite and a suite that exits
      # non-zero after printing a clean summary both fail it too.
      - name: Every suite (exits non-zero if any is not as expected)
        run: Rscript validation/run_gate.R

  # The planted-patient harnesses. They build the engine's own emitted SQL over
  # synthetic patients in duckdb and check the LINES that come out, which is a
  # different question from the R suites: those read the SQL the build would
  # emit, these read what it produces. Every patient-level defect found in
  # review so far came from here rather than from the gate, so a green gate
  # alone was never evidence the lines were right.
  #
  # A separate job because it needs Python with duckdb and sqlglot, and because
  # a translation failure here should read as its own red check rather than as
  # the R gate breaking.
  harnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # The harnesses ask the engine for its SQL, so they need what the engine
      # needs to emit it.
      - name: Install R dependencies
        run: Rscript -e 'install.packages("glue")'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Pinned. These two are not incidental tooling: sqlglot TRANSLATES the
      # Spark SQL this repository emits and duckdb EXECUTES it, so a new
      # version of either can change what the harnesses assert without a line
      # of this repository changing. A translation regression should arrive
      # as a deliberate version bump with the harnesses re-run, not inside an
      # unrelated pull request. These are the versions the planted cases were
      # verified against.
      - name: Install Python dependencies
        run: pip install 'duckdb==1.5.5' 'sqlglot==30.17.0'
      # Each exits non-zero on its own failures. run_synthetic is last and
      # slowest - it draws six hundred patients and runs the shipped QC over
      # them - so the quick ones report first.
      # Which delivery's engine. The emitters refuse to guess when more than
      # one folder carries one, and exit 4 - a failure, not a skip - so this is
      # not optional. It used to default to 'Jul 28', which has not carried an
      # engine since the LOT package moved out, and this job spent that whole
      # time printing SKIP and testing nothing.
      - name: Planted-patient harnesses
        working-directory: validation/synthetic
        env:
          STUDY_FOLDER: 'Sep 10'
        run: |
          set -e
          python3 run_melp_simple.py
          python3 run_map_foldin.py
          python3 run_lot_scenarios.py
          python3 run_aug15_screen.py
          python3 run_synthetic.py
