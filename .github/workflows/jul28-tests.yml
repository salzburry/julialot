name: Jul 28 tests

# The merge gate for the study folder. Everything it runs is pure R over the
# repository's own files - no warehouse, no credentials, no connection - so the
# claim "all suites pass" stops being something an author reports and becomes
# something a machine records against a commit.
#
# Scoped to changes that can affect it: the study folder, the checks that hold
# it to its claims, and this file.
on:
  push:
    paths: ['Jul 28/**', 'validation/**', '.github/workflows/jul28-tests.yml']
  pull_request:
    paths: ['Jul 28/**', 'validation/**', '.github/workflows/jul28-tests.yml']

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # glue writes the SQL every suite inspects. The suites carry a stand-in
      # and degrade to it, but a run that silently took the stand-in is checking
      # slightly different text from the one production loads, so install it and
      # have the real thing.
      - name: Install R dependencies
        run: Rscript -e 'install.packages("glue")'
      # One entry point, one exit status. It pins the port suite's six known
      # failures and fails if that number moves in either direction - fewer
      # means the pin is stale, which is as much a problem as more.
      - name: Every suite (exits non-zero if any is not as expected)
        run: Rscript validation/run_gate.R
