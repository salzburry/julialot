name: jun_21_2026 unit tests

# Independently runs the jun_21_2026 local pure-R suite (the "239/248 pass" claim)
# so the count is CI-recorded, not just an author's local run. Scoped to changes
# under jun_21_2026/; apr_30_2026 production code is never built or run here.
on:
  push:
    paths: ['jun_21_2026/**', '.github/workflows/jun_21_2026-tests.yml']
  pull_request:
    paths: ['jun_21_2026/**', '.github/workflows/jun_21_2026-tests.yml']

jobs:
  rtests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jun_21_2026
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # Only the base-R + these three are used at test time; DBI/odbc are call-time
      # only (the live warehouse path is never exercised by the suite).
      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("digest", "jsonlite", "yaml"))'
      - name: Run unit tests (exits non-zero on any failure)
        run: Rscript tests/run_unit_tests.R
