name: cohort_explorer tests

# Runs the cohort_explorer engine + Shiny (testServer) suites so the "N pass"
# claim is CI-recorded, not just an author's local run. Scoped to changes under
# cohort_explorer/; the production pipeline code is never built or run here.
on:
  push:
    paths: ['cohort_explorer/**', '.github/workflows/cohort_explorer-tests.yml']
  pull_request:
    paths: ['cohort_explorer/**', '.github/workflows/cohort_explorer-tests.yml']

jobs:
  rtests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cohort_explorer
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # survival enables the KM/landmark tests; shiny enables the testServer
      # suite. The engine suite runs on base R alone (both degrade gracefully).
      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("survival", "shiny"))'
      - name: Engine unit tests (exits non-zero on any failure)
        run: Rscript tests/test_engine.R
      - name: Shiny testServer tests (exits non-zero on any failure)
        run: Rscript tests/test_app.R
